logging:
  level:
    root: info
    top:
      yalexin:
        rblog: debug
  file:
    name: log/blog-dev.log
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&useJDBCCompliantTimezoneShift=true&useUnicode=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  address: 0.0.0.0
  servlet:
    context-path: /api

# 阿里云百炼配置
qwen:
  api:
    key: ${ALI_OPENAI_API_KEY}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-long
    # 最大上传文件个数
    max-batch-size: 10
